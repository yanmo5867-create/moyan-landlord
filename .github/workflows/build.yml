name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: android-actions/setup-android@v3
    - run: wget https://downloads.apache.org/ant/binaries/apache-ant-1.10.12-bin.tar.gz
    - run: tar -xzf apache-ant-1.10.12-bin.tar.gz
    - run: echo "ANT_HOME=$PWD/apache-ant-1.10.12" >> $GITHUB_ENV
    - run: echo "$PWD/apache-ant-1.10.12/bin" >> $GITHUB_PATH
    - run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
    - run: echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
    - run: $GITHUB_WORKSPACE/apache-ant-1.10.12/bin/ant debug
    - uses: actions/upload-artifact@v4
      with: { name: moyan-APK, path: bin/*-debug.apk }
